name: Port regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Frozen-bundle runtime and raster regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-port.txt
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install pinned verification packages
        run: python -m pip install -r requirements-port.txt
      - name: Install Chromium and Linux browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify committed bundles with the current runtime
        run: python tools/verify-port.py --runtime-only
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-regression-runtime
          path: build/port-verification/
          if-no-files-found: warn
          retention-days: 14

  full:
    name: TeX compilation and full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-port.txt
      - name: Install TeX and vector conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra lmodern dvisvgm ffmpeg libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6
      - name: Install checksum-pinned Blender producer
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          pin = json.loads(pathlib.Path('tools/blender/toolchain.json').read_text())
          platform = pin['platforms']['linux-x64']
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'texloom-blender'
          folder.mkdir()
          archive = folder / 'blender.tar.xz'
          urls = [platform['url'], platform['url'].replace('https://download.blender.org/', 'https://mirrors.ocf.berkeley.edu/blender/', 1)]
          for url in urls:
              result = subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--connect-timeout', '30', '--max-time', '300', '--user-agent', 'Texloom-CI/1.0', '--output', str(archive), url])
              if result.returncode == 0:
                  assert hashlib.sha256(archive.read_bytes()).hexdigest() == platform['sha256'], 'Blender checksum mismatch'
                  break
          else:
              raise RuntimeError('Pinned Blender archive unavailable from the official server and mirror')
          with tarfile.open(archive) as source:
              source.extractall(folder, filter='data')
          binary = folder / ('blender-' + pin['version'] + '-linux-x64') / 'blender'
          assert binary.is_file()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('BLENDER_EXE=' + str(binary) + '\nTEXLOOM_REQUIRE_BLENDER=1\n')
          PY
          "$RUNNER_TEMP/texloom-blender/blender-4.5.9-linux-x64/blender" --version
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install pinned verification packages
        run: python -m pip install -r requirements-port.txt
      - name: Install Chromium and Linux browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify full source rebuilds and tests
        run: python tools/verify-port.py
      - name: Upload compiler and regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-regression-full
          path: |
            build/port-verification/
            build/gpu-conformance/
          if-no-files-found: warn
          retention-days: 14
